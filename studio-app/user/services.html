<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Services - Aura Studio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/user.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background: var(--bg-light, #F8FAFC); margin: 0; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Scrollable Container -->
  <main style="max-width: 1240px; margin: 0 auto; padding: 32px 24px; flex: 1; width: 100%; box-sizing: border-box;">
        
        <!-- Header Title Banner -->
        <div style="margin-bottom: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
          <div>
            <h1 style="font-size: 24px; font-weight: 800; color: #0F172A; margin-bottom: 4px;">Studio Services & Photography</h1>
            <p style="color: #64748B; font-size: 14px;">Select high-definition studio coverage, portrait sessions, or custom cinematography.</p>
          </div>
          <div style="position: relative; width: 320px; max-width: 100%;">
            <i data-lucide="search" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94A3B8; width: 16px; height: 16px;"></i>
            <input type="text" id="search-services" class="form-input" placeholder="Search services..." style="padding-left: 40px; border-radius: 99px; font-size: 13px; background: white; border: 1px solid #E2E8F0;">
          </div>
        </div>

        <!-- Category Pills Filter Bar -->
        <div class="app-category-pills" id="services-category-pills" style="margin-bottom: 24px;">
          <div class="app-cat-pill active" data-category="all">
            <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i> All Services
          </div>
          <div class="app-cat-pill" data-category="Portrait">
            <img src="https://img.icons8.com/external-xnimrodx-lineal-color-xnimrodx/64/external-portrait-art-and-design-studio-xnimrodx-lineal-color-xnimrodx.png" alt="Portrait" style="width: 15px; height: 15px; object-fit: contain;"> Portrait Shoot
          </div>
          <div class="app-cat-pill" data-category="Wedding">
            <i data-lucide="heart" style="width: 14px; height: 14px;"></i> Wedding & Event
          </div>
          <div class="app-cat-pill" data-category="Product">
            <i data-lucide="package" style="width: 14px; height: 14px;"></i> Product E-Commerce
          </div>
          <div class="app-cat-pill" data-category="Fashion">
            <i data-lucide="sun" style="width: 14px; height: 14px;"></i> Outdoor & Fashion
          </div>
        </div>

        <!-- Services Grid -->
        <div class="app-cards-grid" id="services-grid-container">
          <!-- Dynamically filled by JS -->
        </div>

  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Service Details Modal -->
  <div id="service-details-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 99999; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 500px; width: 90%; position: relative; animation: scaleUp 0.2s ease forwards; padding: 32px; border-radius: 24px;">
      <button id="close-service-modal" style="position: absolute; top: 20px; right: 20px; background: none; border: none; cursor: pointer; color: var(--text-secondary);"><i data-lucide="x"></i></button>
      
      <div id="modal-service-icon" style="width: 56px; height: 56px; border-radius: 16px; background-color: rgba(16, 185, 129, 0.1); color: #10B981; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
        <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
      </div>
      
      <h3 id="modal-service-title" style="font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">Service Name</h3>
      
      <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 20px;">
        <span class="badge badge-success" style="font-size: 13px;"><i data-lucide="clock" style="width: 14px; height: 14px; margin-right: 4px; display: inline-block; vertical-align: middle;"></i> <span id="modal-service-duration">1 Hour</span></span>
        <span style="font-weight: 700; color: var(--text-primary); font-size: 18px;" id="modal-service-price">₹1,500</span>
      </div>

      <p id="modal-service-desc" style="color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin-bottom: 32px;">
        Description text goes here...
      </p>

      <div style="display: flex; justify-content: flex-end; gap: 12px;">
        <button class="btn btn-outline" id="modal-cancel-btn" style="border-radius: 99px;">Close</button>
        <a href="#" class="btn btn-primary" id="modal-book-btn" style="border-radius: 99px; background: #0F172A; border: none;">Proceed to Booking</a>
      </div>
    </div>
  </div>

  <!-- Global scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/user.js"></script>
  <script>
    function initServicesPage() {
      let services = window.getServices ? window.getServices() : [];
      const gridContainer = document.getElementById("services-grid-container");
      const searchInput = document.getElementById("search-services");
      
      // Modal elements
      const modal = document.getElementById("service-details-modal");
      const modalIcon = document.getElementById("modal-service-icon");
      const modalTitle = document.getElementById("modal-service-title");
      const modalDuration = document.getElementById("modal-service-duration");
      const modalPrice = document.getElementById("modal-service-price");
      const modalDesc = document.getElementById("modal-service-desc");
      const modalBookBtn = document.getElementById("modal-book-btn");
      const closeModalBtn = document.getElementById("close-service-modal");
      const modalCancelBtn = document.getElementById("modal-cancel-btn");

      let currentCategory = 'all';

      const serviceImagesMap = {
        "srv-portrait": "../assets/portrait.jpg",
        "srv-wedding": "../assets/wedding.jpg",
        "srv-product": "../assets/product.jpg",
        "srv-prewedding": "../assets/prewedding.jpg",
        "srv-baby": "../assets/baby.jpg",
        "srv-event": "../assets/event.jpg",
        "srv-video": "../assets/video.jpg",
        "srv-editing": "../assets/editing.jpg"
      };

      // Render services function
      function renderServices(items) {
        if (items.length === 0) {
          gridContainer.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text-secondary);">
              <i data-lucide="info" style="width: 48px; height: 48px; margin: 0 auto 16px auto; opacity: 0.5;"></i>
              <p>No services matched your query.</p>
            </div>
          `;
          if (window.lucide) window.lucide.createIcons();
          return;
        }

        gridContainer.innerHTML = items.map(s => {
          let imgSrc = s.image;
          if (serviceImagesMap[s.id]) {
            imgSrc = serviceImagesMap[s.id];
          } else if (s.name.toLowerCase().includes("baby")) {
            imgSrc = "../assets/baby.jpg";
          } else if (s.name.toLowerCase().includes("event")) {
            imgSrc = "../assets/event.jpg";
          } else if (s.name.toLowerCase().includes("video")) {
            imgSrc = "../assets/video.jpg";
          } else if (s.name.toLowerCase().includes("edit")) {
            imgSrc = "../assets/editing.jpg";
          } else if (s.name.toLowerCase().includes("portrait")) {
            imgSrc = "../assets/portrait.jpg";
          } else if (s.name.toLowerCase().includes("wedding") && !s.name.toLowerCase().includes("pre")) {
            imgSrc = "../assets/wedding.jpg";
          } else if (s.name.toLowerCase().includes("product")) {
            imgSrc = "../assets/product.jpg";
          } else if (s.name.toLowerCase().includes("pre-wedding") || s.name.toLowerCase().includes("prewedding")) {
            imgSrc = "../assets/prewedding.jpg";
          }

          imgSrc = imgSrc || 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80';

          return `
            <div class="app-card-item">
              <div style="width: 100%; height: 120px; border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: #F1F5F9;">
                <img src="${imgSrc}" alt="${s.name}" style="width: 100%; height: 100%; object-fit: cover;">
              </div>
              <div>
                <h4 class="app-card-title">${s.name}</h4>
                <p class="app-card-desc">${(s.description || 'Professional studio photoshoot with lighting and retouched deliverables.').substring(0, 70)}...</p>
              </div>
              <div class="app-card-footer">
                <div class="app-card-price">
                  ₹${(s.price || s.basePrice || 1500).toLocaleString('en-IN')}
                  <span>/ ${s.duration || '1 Hour'}</span>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button class="btn btn-outline btn-sm details-trigger-btn" data-id="${s.id}" style="border-radius: 99px; font-size: 11px;">Details</button>
                  <a href="booking.html?service=${s.id}" class="app-card-book-btn">Book</a>
                </div>
              </div>
            </div>
          `;
        }).join("");

        if (window.lucide) window.lucide.createIcons();

        // Attach details trigger listeners
        const detailsTriggers = gridContainer.querySelectorAll(".details-trigger-btn");
        detailsTriggers.forEach(btn => {
          btn.addEventListener("click", () => {
            const sId = btn.getAttribute("data-id");
            const s = services.find(item => item.id === sId);
            if (s) {
              modalIcon.innerHTML = `<i data-lucide="${s.icon || 'camera'}" style="width: 28px; height: 28px;"></i>`;
              modalTitle.textContent = s.name;
              modalDuration.textContent = s.duration || '1 Hour';
              modalPrice.textContent = `₹${(s.price || 1500).toLocaleString('en-IN')}`;
              modalDesc.textContent = s.description;
              modalBookBtn.setAttribute("href", `booking.html?service=${s.id}`);
              
              modal.style.display = "flex";
              if (window.lucide) window.lucide.createIcons();
            }
          });
        });
      }

      // Initial filter & render
      const activeServices = services.filter(s => s.status === "active");
      
      function filterAndRender() {
        const query = searchInput.value.toLowerCase().trim();
        let filtered = activeServices;

        if (currentCategory !== 'all') {
          filtered = filtered.filter(s => s.category && s.category.toLowerCase().includes(currentCategory.toLowerCase()));
        }

        if (query) {
          filtered = filtered.filter(s => 
            s.name.toLowerCase().includes(query) || 
            s.description.toLowerCase().includes(query)
          );
        }

        renderServices(filtered);
      }

      filterAndRender();

      // Search event
      searchInput.addEventListener("input", filterAndRender);

      // Category Pills Handlers
      const pills = document.querySelectorAll("#services-category-pills .app-cat-pill");
      pills.forEach(pill => {
        pill.addEventListener("click", () => {
          pills.forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
          currentCategory = pill.getAttribute("data-category");
          filterAndRender();
        });
      });

      // Modal closings
      function closeModal() {
        modal.style.display = "none";
      }
      closeModalBtn.addEventListener("click", closeModal);
      modalCancelBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initServicesPage);
    } else {
      initServicesPage();
    }
  </script>
</body>
</html>
