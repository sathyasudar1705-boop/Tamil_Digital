<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - Aura Studio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/user.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Header Banner -->
  <header style="background: linear-gradient(135deg, var(--soft-green) 0%, var(--soft-blue) 100%); padding: 64px 24px; text-align: center; border-bottom: 1px solid var(--border);">
    <div style="max-width: 800px; margin: 0 auto;">
      <h1 style="font-size: 36px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px;">Our Services</h1>
      <p style="color: var(--text-secondary); font-size: 15px;">Professional photography & cinematography solutions catered to brands and family milestones.</p>
    </div>
  </header>

  <!-- Main Grid Content -->
  <main class="container" style="padding: 64px 24px;">
    <!-- Search Bar -->
    <div style="max-width: 480px; margin: 0 auto 40px auto; position: relative;">
      <i data-lucide="search" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 18px; height: 18px;"></i>
      <input type="text" id="search-services" class="form-input" placeholder="Search services (e.g. Portrait, Baby)..." style="padding-left: 48px; border-radius: 999px;">
    </div>

    <!-- Services Grid -->
    <div class="services-grid" id="services-grid-container">
      <!-- Dynamically filled by JS -->
    </div>
  </main>

  <!-- Service Details Modal -->
  <div id="service-details-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 99999; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 500px; width: 90%; position: relative; animation: scaleUp 0.2s ease forwards; padding: 32px;">
      <button id="close-service-modal" style="position: absolute; top: 20px; right: 20px; background: none; border: none; cursor: pointer; color: var(--text-secondary);"><i data-lucide="x"></i></button>
      
      <div id="modal-service-icon" style="width: 56px; height: 56px; border-radius: var(--radius-sm); background-color: var(--soft-green); color: var(--primary-green); display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
        <i data-lucide="camera" style="width: 28px; height: 28px;"></i>
      </div>
      
      <h3 id="modal-service-title" style="font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">Service Name</h3>
      
      <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 20px;">
        <span class="badge badge-success" style="font-size: 13px;"><i data-lucide="clock" style="width: 14px; height: 14px; margin-right: 4px; display: inline-block; vertical-align: middle;"></i> <span id="modal-service-duration">1 Hour</span></span>
        <span style="font-weight: 700; color: var(--text-primary); font-size: 18px;" id="modal-service-price">₹1,500</span>
      </div>

      <p id="modal-service-desc" style="color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin-bottom: 32px;">
        Description text goes here...
      </p>

      <div style="display: flex; justify-content: flex-end; gap: 12px;">
        <button class="btn btn-outline" id="modal-cancel-btn">Close</button>
        <a href="#" class="btn btn-primary" id="modal-book-btn">Proceed to Booking</a>
      </div>
    </div>
  </div>

  <!-- Dynamic Footer -->
  <div id="footer-placeholder"></div>

  <!-- Global scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let services = window.getServices ? window.getServices() : [];
      const gridContainer = document.getElementById("services-grid-container");
      const searchInput = document.getElementById("search-services");
      
      // Modal elements
      const modal = document.getElementById("service-details-modal");
      const modalIcon = document.getElementById("modal-service-icon");
      const modalTitle = document.getElementById("modal-service-title");
      const modalDuration = document.getElementById("modal-service-duration");
      const modalPrice = document.getElementById("modal-service-price");
      const modalDesc = document.getElementById("modal-service-desc");
      const modalBookBtn = document.getElementById("modal-book-btn");
      const closeModalBtn = document.getElementById("close-service-modal");
      const modalCancelBtn = document.getElementById("modal-cancel-btn");

      // Render services function
      function renderServices(items) {
        if (items.length === 0) {
          gridContainer.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text-secondary);">
              <i data-lucide="info" style="width: 48px; height: 48px; margin: 0 auto 16px auto; opacity: 0.5;"></i>
              <p>No services matched your query.</p>
            </div>
          `;
          if (window.lucide) window.lucide.createIcons();
          return;
        }

        gridContainer.innerHTML = items.map(s => `
          <div class="card card-hover service-card">
            <div class="service-icon-box">
              <i data-lucide="${s.icon}"></i>
            </div>
            <h3 class="service-card-title">${s.name}</h3>
            <p class="service-card-desc">${s.description.substring(0, 95)}...</p>
            <div class="service-card-footer">
              <div>
                <span class="service-price-label">Starting Price</span>
                <div class="service-price-value">₹${s.price.toLocaleString('en-IN')}</div>
              </div>
              <div style="display: flex; gap: 8px;">
                <button class="btn btn-outline btn-sm details-trigger-btn" data-id="${s.id}">Details</button>
                <a href="booking.html?service=${s.id}" class="btn btn-primary btn-sm">Book</a>
              </div>
            </div>
          </div>
        `).join("");

        if (window.lucide) window.lucide.createIcons();

        // Attach details trigger listeners
        const detailsTriggers = gridContainer.querySelectorAll(".details-trigger-btn");
        detailsTriggers.forEach(btn => {
          btn.addEventListener("click", () => {
            const sId = btn.getAttribute("data-id");
            const s = services.find(item => item.id === sId);
            if (s) {
              modalIcon.innerHTML = `<i data-lucide="${s.icon}" style="width: 28px; height: 28px;"></i>`;
              modalTitle.textContent = s.name;
              modalDuration.textContent = s.duration;
              modalPrice.textContent = `₹${s.price.toLocaleString('en-IN')}`;
              modalDesc.textContent = s.description;
              modalBookBtn.setAttribute("href", `booking.html?service=${s.id}`);
              
              modal.style.display = "flex";
              if (window.lucide) window.lucide.createIcons();
            }
          });
        });
      }

      // Initial render (only active services)
      const activeServices = services.filter(s => s.status === "active");
      renderServices(activeServices);

      // Search filters
      searchInput.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = activeServices.filter(s => 
          s.name.toLowerCase().includes(query) || 
          s.description.toLowerCase().includes(query)
        );
        renderServices(filtered);
      });

      // Modal closings
      function closeModal() {
        modal.style.display = "none";
      }
      closeModalBtn.addEventListener("click", closeModal);
      modalCancelBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
    });
  </script>
</body>
</html>
