<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Customers - Aura Studio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="admin-layout">
    <!-- Dynamic Sidebar -->
    <div id="admin-sidebar-placeholder"></div>

    <!-- Main Panel -->
    <main class="admin-main">
      <!-- Dynamic Header -->
      <div id="admin-header-placeholder"></div>

      <!-- Page Content -->
      <div class="admin-content">
        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Customers Directory</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Browse, update, and manage studio client profiles and spend metrics.</p>
          </div>
          <button id="add-customer-btn" class="btn btn-primary"><i data-lucide="plus"></i> Add Customer</button>
        </div>

        <!-- Directory Table Card -->
        <div class="card" style="padding: 0; overflow: hidden; border-radius: var(--radius-md);">
          <div class="table-container" style="border: none; border-radius: 0;">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Customer Name</th>
                  <th>Email Address</th>
                  <th>Phone Number</th>
                  <th>Total Bookings</th>
                  <th>Total Spent</th>
                  <th>Last Booking Date</th>
                  <th>Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="customers-table-body">
                <!-- Dynamically filled -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add/Edit Customer Modal -->
  <div id="customer-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 99999; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 460px; width: 90%; padding: 32px; position: relative; animation: scaleUp 0.2s ease forwards;">
      <button class="close-modal-btn" style="position: absolute; top: 20px; right: 20px; background: none; border: none; cursor: pointer; color: var(--text-secondary);"><i data-lucide="x"></i></button>
      
      <h3 style="font-size: 18px; font-weight: 800; color: var(--text-primary); margin-bottom: 24px;" id="modal-title">Add New Customer</h3>

      <form id="customer-form">
        <input type="hidden" id="cust-id">
        
        <div class="form-group">
          <label class="form-label" for="cust-name">Full Name</label>
          <input type="text" id="cust-name" class="form-input" placeholder="Rahul Verma" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-email">Email Address</label>
          <input type="email" id="cust-email" class="form-input" placeholder="rahul@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-phone">Phone Number</label>
          <input type="tel" id="cust-phone" class="form-input" placeholder="9876543210" required pattern="[0-9]{10}">
        </div>

        <div class="form-group">
          <label class="form-label" for="cust-status">Account Status</label>
          <select id="cust-status" class="form-input" required>
            <option value="active" selected>Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px;">
          <button type="button" class="btn btn-outline close-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Global Admin Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tbody = document.getElementById("customers-table-body");
      const modal = document.getElementById("customer-modal");
      const form = document.getElementById("customer-form");
      const modalTitle = document.getElementById("modal-title");
      const addCustomerBtn = document.getElementById("add-customer-btn");
      
      const inputId = document.getElementById("cust-id");
      const inputName = document.getElementById("cust-name");
      const inputEmail = document.getElementById("cust-email");
      const inputPhone = document.getElementById("cust-phone");
      const inputStatus = document.getElementById("cust-status");

      function renderCustomers() {
        const list = window.getCustomers ? window.getCustomers() : [];
        const searchInput = document.getElementById("global-admin-search");
        let query = searchInput ? searchInput.value.toLowerCase().trim() : "";

        let filtered = list;
        if (query) {
          filtered = list.filter(c => 
            c.name.toLowerCase().includes(query) ||
            c.email.toLowerCase().includes(query) ||
            c.phone.includes(query)
          );
        }

        if (filtered.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" style="text-align: center; color: var(--text-secondary); padding: 48px;">
                <p>No customers found matching search criteria.</p>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = filtered.map(c => `
          <tr>
            <td><strong>${c.name}</strong></td>
            <td>${c.email}</td>
            <td>${c.phone}</td>
            <td>${c.totalBookings} Sessions</td>
            <td><strong>₹${c.totalSpent.toLocaleString('en-IN')}</strong></td>
            <td>${c.lastBooking}</td>
            <td><span class="badge ${c.status === 'active' ? 'badge-success' : 'badge-danger'}">${c.status}</span></td>
            <td style="text-align: right;">
              <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button class="btn btn-outline btn-sm edit-btn" data-id="${c.id}">Edit</button>
                <button class="btn btn-outline btn-sm delete-btn" data-id="${c.id}"><i data-lucide="trash-2" style="width: 14px; height: 14px; color: var(--danger);"></i></button>
              </div>
            </td>
          </tr>
        `).join("");

        if (window.lucide) window.lucide.createIcons();

        // Bind Row actions
        tbody.querySelectorAll(".edit-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const cId = btn.getAttribute("data-id");
            const c = list.find(item => item.id === cId);
            if (c) {
              inputId.value = c.id;
              inputName.value = c.name;
              inputEmail.value = c.email;
              inputPhone.value = c.phone;
              inputStatus.value = c.status;

              modalTitle.textContent = "Edit Customer Profile";
              modal.style.display = "flex";
            }
          });
        });

        tbody.querySelectorAll(".delete-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const cId = btn.getAttribute("data-id");
            window.createConfirmationModal(
              "Delete Customer Profile?",
              "Are you sure you want to delete this customer record? Their profile details will be cleared.",
              "Yes, Delete Record",
              "Keep Record",
              () => {
                window.deleteCustomer(cId);
                window.showToast("Customer profile deleted", "warning");
                renderCustomers();
              }
            );
          });
        });
      }

      // Initial run
      renderCustomers();

      // Live search input changes
      const searchInput = document.getElementById("global-admin-search");
      if (searchInput) {
        searchInput.addEventListener("input", renderCustomers);
      }

      // Add customer trigger
      addCustomerBtn.addEventListener("click", () => {
        form.reset();
        inputId.value = "";
        modalTitle.textContent = "Add New Customer";
        modal.style.display = "flex";
      });

      // Close modal actions
      function closeModal() {
        modal.style.display = "none";
      }
      modal.querySelectorAll(".close-modal-btn").forEach(btn => {
        btn.addEventListener("click", closeModal);
      });
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      // Submit modal form
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const id = inputId.value;
        const nameVal = inputName.value.trim();
        const emailVal = inputEmail.value.trim();
        const phoneVal = inputPhone.value.trim();
        const statusVal = inputStatus.value;

        const customerPayload = {
          name: nameVal,
          email: emailVal,
          phone: phoneVal,
          status: statusVal
        };

        if (id) {
          // Edit mode
          window.updateCustomer(id, customerPayload);
          window.showToast("Customer updated successfully");
        } else {
          // Add mode
          window.addCustomer(customerPayload);
          window.showToast("Customer added successfully");
        }

        closeModal();
        renderCustomers();
      });

    });
  </script>
</body>
</html>
