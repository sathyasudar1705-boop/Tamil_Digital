<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Gallery - Aura Studio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="admin-layout">
    <!-- Dynamic Sidebar -->
    <div id="admin-sidebar-placeholder"></div>

    <!-- Main Panel -->
    <main class="admin-main">
      <!-- Dynamic Header -->
      <div id="admin-header-placeholder"></div>

      <!-- Page Content -->
      <div class="admin-content">
        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Manage Gallery</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Simulate image catalog updates and category filters for the customer portfolio.</p>
          </div>
          <button id="add-image-btn" class="btn btn-primary"><i data-lucide="plus"></i> Add Portfolio Image</button>
        </div>

        <!-- Filter tabs -->
        <div class="admin-filters-panel" id="admin-gallery-tabs" style="background: none; border: none; padding: 0; margin-bottom: 32px; display: flex; gap: 8px;">
          <button class="btn btn-outline btn-sm active-tab" data-category="all" style="background: white;">All Photos</button>
          <button class="btn btn-outline btn-sm" data-category="portrait" style="background: white;">Portrait</button>
          <button class="btn btn-outline btn-sm" data-category="wedding" style="background: white;">Wedding</button>
          <button class="btn btn-outline btn-sm" data-category="pre-wedding" style="background: white;">Pre-Wedding</button>
          <button class="btn btn-outline btn-sm" data-category="product" style="background: white;">Product</button>
          <button class="btn btn-outline btn-sm" data-category="events" style="background: white;">Events</button>
        </div>

        <!-- Gallery Grid -->
        <div class="admin-metrics-grid" id="admin-gallery-grid" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));">
          <!-- Dynamically filled -->
        </div>

      </div>
    </main>
  </div>

  <!-- Add Image Modal -->
  <div id="image-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 99999; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 440px; width: 90%; padding: 32px; position: relative; animation: scaleUp 0.2s ease forwards;">
      <button class="close-modal-btn" style="position: absolute; top: 20px; right: 20px; background: none; border: none; cursor: pointer; color: var(--text-secondary);"><i data-lucide="x"></i></button>
      
      <h3 style="font-size: 18px; font-weight: 800; color: var(--text-primary); margin-bottom: 24px;">Add New Portfolio Photo</h3>

      <form id="image-form">
        <div class="form-group">
          <label class="form-label" for="img-url">Mock Image URL</label>
          <input type="url" id="img-url" class="form-input" placeholder="https://images.unsplash.com/photo-..." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="img-title">Photo Title</label>
          <input type="text" id="img-title" class="form-input" placeholder="Sunset Couple Portrait" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="img-category">Category</label>
          <select id="img-category" class="form-input" required>
            <option value="portrait">Portrait</option>
            <option value="wedding">Wedding</option>
            <option value="pre-wedding">Pre-Wedding</option>
            <option value="product">Product</option>
            <option value="events">Events</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px;">
          <button type="button" class="btn btn-outline close-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Photo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Global Admin Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("admin-gallery-grid");
      const tabContainer = document.getElementById("admin-gallery-tabs");
      const modal = document.getElementById("image-modal");
      const form = document.getElementById("image-form");
      const addImageBtn = document.getElementById("add-image-btn");

      let currentCategory = "all";

      function renderGallery() {
        const list = window.getGallery ? window.getGallery() : [];
        
        let filtered = list;
        if (currentCategory !== "all") {
          filtered = list.filter(item => item.category.toLowerCase() === currentCategory.toLowerCase());
        }

        if (filtered.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text-secondary);">
              <p>No photos in this category yet.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = filtered.map(item => `
          <div class="card" style="padding: 12px; display: flex; flex-direction: column; justify-content: space-between;">
            <div style="position: relative; border-radius: var(--radius-sm); overflow: hidden; aspect-ratio: 4/3; margin-bottom: 12px; border: 1px solid var(--border);">
              <img src="${item.url}" alt="${item.title}" style="width: 100%; height: 100%; object-fit: cover;">
              <span class="badge badge-info" style="position: absolute; bottom: 8px; left: 8px; font-size: 10px; background-color: rgba(255,255,255,0.9); box-shadow: var(--shadow-sm);">${item.category}</span>
            </div>
            
            <div style="display: flex; align-items: start; justify-content: space-between; gap: 8px;">
              <p style="font-weight: 600; font-size: 13px; color: var(--text-primary); line-height: 1.4; word-break: break-word;">${item.title}</p>
              <button class="btn btn-outline btn-sm delete-btn" data-id="${item.id}" style="padding: 4px 6px; border-color: rgba(239, 68, 68, 0.2);"><i data-lucide="trash-2" style="width: 14px; height: 14px; color: var(--danger);"></i></button>
            </div>
          </div>
        `).join("");

        if (window.lucide) window.lucide.createIcons();

        // Bind delete action
        container.querySelectorAll(".delete-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            window.createConfirmationModal(
              "Remove Image?",
              "Are you sure you want to remove this photo from the gallery portfolio?",
              "Yes, Remove",
              "Keep Image",
              () => {
                window.deleteGalleryItem(id);
                window.showToast("Portfolio image removed");
                renderGallery();
              }
            );
          });
        });
      }

      // Initial run
      renderGallery();

      // Tab handlers
      const tabs = tabContainer.querySelectorAll("button");
      tabs.forEach(tab => {
        tab.addEventListener("click", () => {
          tabs.forEach(t => {
            t.style.backgroundColor = "white";
            t.style.color = "var(--text-secondary)";
            t.style.borderColor = "var(--border)";
          });
          tab.style.backgroundColor = "var(--primary-green)";
          tab.style.color = "white";
          tab.style.borderColor = "var(--primary-green)";
          
          currentCategory = tab.getAttribute("data-category");
          renderGallery();
        });
      });

      // Show/Close modal handles
      addImageBtn.addEventListener("click", () => {
        form.reset();
        modal.style.display = "flex";
      });

      function closeModal() {
        modal.style.display = "none";
      }
      modal.querySelectorAll(".close-modal-btn").forEach(btn => {
        btn.addEventListener("click", closeModal);
      });
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      // Submit Form
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const urlVal = document.getElementById("img-url").value.trim();
        const titleVal = document.getElementById("img-title").value.trim();
        const catVal = document.getElementById("img-category").value;

        window.addGalleryItem({
          url: urlVal,
          title: titleVal,
          category: catVal
        });

        window.showToast("Portfolio photo added!");
        closeModal();
        renderGallery();
      });

    });
  </script>
</body>
</html>
