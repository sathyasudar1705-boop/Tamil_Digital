<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports & Stats - Aura Studio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="admin-layout">
    <!-- Dynamic Sidebar -->
    <div id="admin-sidebar-placeholder"></div>

    <!-- Main Panel -->
    <main class="admin-main">
      <!-- Dynamic Header -->
      <div id="admin-header-placeholder"></div>

      <!-- Page Content -->
      <div class="admin-content">
        <div class="admin-page-header">
          <div>
            <h1 class="admin-page-title">Reports & Analytics</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">Review financial trends, popularity of services, and customer registration stats.</p>
          </div>
          
          <button id="export-report-btn" class="btn btn-outline" style="background: white;"><i data-lucide="download"></i> Export CSV Report</button>
        </div>

        <!-- Filters Panel -->
        <div class="admin-filters-panel" style="margin-bottom: 32px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <i data-lucide="filter" style="color: var(--text-secondary); width: 18px; height: 18px;"></i>
            <span style="font-size: 14px; font-weight: 600; color: var(--text-primary);">Timeline Filter:</span>
          </div>
          
          <select id="report-timeline" class="filter-select">
            <option value="year" selected>This Year (2026)</option>
            <option value="month">This Month (August)</option>
            <option value="week">This Week</option>
          </select>
        </div>

        <!-- Charts grid -->
        <div class="charts-grid" style="grid-template-columns: 1.2fr 0.8fr;">
          <!-- 1. Monthly Revenue line -->
          <div class="card" style="padding: 24px; min-height: 380px;">
            <h3 style="font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 20px;">Revenue Stream (₹)</h3>
            <div style="position: relative; height: 300px; width: 100%;">
              <canvas id="revenueChart"></canvas>
            </div>
          </div>

          <!-- 2. Services Breakdown Pie -->
          <div class="card" style="padding: 24px; display: flex; flex-direction: column;">
            <h3 style="font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 20px;">Photoshoot Shares</h3>
            <div style="position: relative; height: 260px; width: 100%; display: flex; justify-content: center; align-items: center; flex-grow: 1;">
              <canvas id="servicesChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Secondary row -->
        <div class="charts-grid" style="grid-template-columns: 1fr 1fr; margin-top: 24px;">
          <!-- 3. Customer registrations bar -->
          <div class="card" style="padding: 24px; min-height: 340px;">
            <h3 style="font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 20px;">New Customers Acquired</h3>
            <div style="position: relative; height: 250px; width: 100%;">
              <canvas id="acquisitionsChart"></canvas>
            </div>
          </div>

          <!-- 4. Package distributions doughnut -->
          <div class="card" style="padding: 24px; display: flex; flex-direction: column; min-height: 340px;">
            <h3 style="font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 20px;">Inclusions Tier Selected</h3>
            <div style="position: relative; height: 220px; width: 100%; display: flex; justify-content: center; align-items: center; flex-grow: 1;">
              <canvas id="packagesChart"></canvas>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Global Admin Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const bookings = window.getBookings ? window.getBookings() : [];

      // Dynamic variables calculations
      // Count services
      const sCounts = {};
      bookings.forEach(b => {
        sCounts[b.serviceName] = (sCounts[b.serviceName] || 0) + 1;
      });

      // Count packages
      const pCounts = {};
      bookings.forEach(b => {
        pCounts[b.packageName] = (pCounts[b.packageName] || 0) + 1;
      });

      // 1. Revenue line chart
      const ctxRevenue = document.getElementById('revenueChart').getContext('2d');
      const revenueChart = new Chart(ctxRevenue, {
        type: 'line',
        data: {
          labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
          datasets: [{
            label: 'Monthly Net (₹)',
            data: [45000, 32000, 58000, 41000, 72000, 68000, 94000, 110500, 0, 0, 0, 0],
            borderColor: '#3B82F6',
            backgroundColor: 'rgba(59, 130, 246, 0.05)',
            borderWidth: 3,
            tension: 0.35,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });

      // 2. Services Pie Chart
      const ctxServices = document.getElementById('servicesChart').getContext('2d');
      new Chart(ctxServices, {
        type: 'pie',
        data: {
          labels: Object.keys(sCounts).length ? Object.keys(sCounts) : ['Portrait', 'Wedding', 'Product'],
          datasets: [{
            data: Object.values(sCounts).length ? Object.values(sCounts) : [3, 2, 2],
            backgroundColor: ['#16A34A', '#3B82F6', '#F59E0B', '#10B981', '#6366F1', '#EC4899']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } }
          }
        }
      });

      // 3. Customer acquisitions bar chart
      const ctxAcquisitions = document.getElementById('acquisitionsChart').getContext('2d');
      new Chart(ctxAcquisitions, {
        type: 'bar',
        data: {
          labels: ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'],
          datasets: [{
            label: 'New Customers Registered',
            data: [15, 22, 19, 31, 28, 38],
            backgroundColor: '#16A34A',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });

      // 4. Package distribution Doughnut
      const ctxPackages = document.getElementById('packagesChart').getContext('2d');
      new Chart(ctxPackages, {
        type: 'doughnut',
        data: {
          labels: Object.keys(pCounts).length ? Object.keys(pCounts) : ['Basic', 'Premium', 'Professional'],
          datasets: [{
            data: Object.values(pCounts).length ? Object.values(pCounts) : [2, 4, 1],
            backgroundColor: ['#EFF6FF', '#DBEAFE', '#3B82F6'],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
        }
      });

      // Timeline filter switcher
      document.getElementById("report-timeline").addEventListener("change", (e) => {
        const val = e.target.value;
        if (val === 'year') {
          revenueChart.data.labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          revenueChart.data.datasets[0].data = [45000, 32000, 58000, 41000, 72000, 68000, 94000, 110500, 0, 0, 0, 0];
        } else if (val === 'month') {
          revenueChart.data.labels = ['Week 1', 'Week 2', 'Week 3', 'Week 4'];
          revenueChart.data.datasets[0].data = [24000, 31000, 28000, 27500];
        } else {
          revenueChart.data.labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
          revenueChart.data.datasets[0].data = [1500, 4000, 2500, 0, 8500, 12000, 14500];
        }
        revenueChart.update();
      });

      // Export handler
      document.getElementById("export-report-btn").addEventListener("click", () => {
        window.showToast("Exporting data summary to CSV file... (Simulated)", "info");
        setTimeout(() => {
          window.showToast("CSV report file downloaded successfully!");
        }, 1200);
      });

    });
  </script>
</body>
</html>
